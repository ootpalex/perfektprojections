name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tgs-viz/package-lock.json

      # xgboost's macOS wheel links @rpath/libomp.dylib (Homebrew's libomp)
      - name: libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ml.txt -r requirements-dev.txt

      - name: ML packages load
        run: python -c "import numpy, pandas, sklearn, xgboost; print('xgboost', xgboost.__version__)"

      # Each module in its own process: the modules set their environment at import and
      # cache settings-dependent modules (as under unittest discover).
      - name: Python tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          rc=0
          for f in tgs-viz/tools/tests/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" -q -p no:cacheprovider || rc=1
            echo "::endgroup::"
          done
          python tgs-viz/tools/tests/test_bat_equivalence.py || rc=1
          exit $rc

      - name: App packages
        working-directory: tgs-viz
        run: npm ci

      - name: Node tests
        run: |
          rc=0
          for f in tgs-viz/control/test/fileMap.test.mjs tgs-viz/control/test/guards.test.mjs \
                   tgs-viz/control/test/pythonMain.test.mjs tgs-viz/tests/client/*.test.mjs; do
            echo "::group::$f"
            node "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Start Vite on 3101 themselves; they exercise the POSIX job, lock and restart paths.
      - name: Control smoke tests
        run: |
          node tgs-viz/control/test/failsafe.smoke.mjs
          node tgs-viz/control/test/restart.smoke.mjs

      - name: Build the app
        working-directory: tgs-viz
        run: npm run build
